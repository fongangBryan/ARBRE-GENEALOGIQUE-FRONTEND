<div class="layout" [class.mob-open]="sidebarOpen()">

  <div class="overlay" (click)="sidebarOpen.set(false)"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="s-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="4.5" r="1.8" fill="#fff"/>
          <line x1="12" y1="6.3" x2="12" y2="9"/>
          <line x1="7" y1="9" x2="17" y2="9"/>
          <line x1="7" y1="9" x2="7" y2="12"/>
          <line x1="17" y1="9" x2="17" y2="12"/>
          <circle cx="7" cy="13.5" r="1.5" fill="#fff"/>
          <circle cx="17" cy="13.5" r="1.5" fill="#fff"/>
          <line x1="7" y1="15" x2="4" y2="18.5"/>
          <line x1="7" y1="15" x2="10" y2="18.5"/>
          <line x1="17" y1="15" x2="14" y2="18.5"/>
          <line x1="17" y1="15" x2="20" y2="18.5"/>
        </svg>
      </div>
      <span class="s-logo-name">GeneaTree</span>
    </div>

    <nav class="sidebar-nav">
      <p class="nav-section">Principal</p>

      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
        <svg class="ni" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Tableau de bord
      </a>

      <a routerLink="/tree" routerLinkActive="active" class="nav-item">
        <svg class="ni" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L12 7"/><path d="M12 7C12 7 8 9 6 13H18C16 9 12 7 12 7Z"/><path d="M12 13V22"/><path d="M8 18H16"/></svg>
        Arbre généalogique
      </a>

      <a routerLink="/members" routerLinkActive="active" class="nav-item">
        <svg class="ni" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Membres
      </a>

      @if (isEditor()) {
        <a routerLink="/unions" routerLinkActive="active" class="nav-item">
          <svg class="ni" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="3"/><circle cx="15" cy="12" r="3"/><path d="M12 12h.01"/></svg>
          Unions
        </a>

        <a routerLink="/media" routerLinkActive="active" class="nav-item">
          <svg class="ni" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Photos & Médias
        </a>
      }

      <p class="nav-section">Compte</p>

      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <svg class="ni" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Paramètres
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sf-avatar">{{ getUserInitials() }}</div>
      <div class="sf-info">
        <p class="sf-email">{{ getUserEmail() }}</p>
        <p class="sf-role">{{ getUserRole() }}</p>
      </div>
      <button class="logout-btn" (click)="logout()" title="Se déconnecter">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-brand">
        <h1 class="topbar-title">{{ pageTitle }}</h1>
        <p class="topbar-sub">{{ pageSubtitle }}</p>
      </div>
      <span class="tb-spacer"></span>
      <div class="topbar-right">
        <div class="tb-avatar">{{ getUserInitials() }}</div>
      </div>
    </header>

    <div class="content">
      <ng-content></ng-content>
    </div>
  </main>
</div>
