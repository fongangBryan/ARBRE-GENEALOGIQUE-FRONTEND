networks:
  genealogie-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: genealogie_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: genealogie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5540:5432"   # 5432 et 5433-5532 indisponibles sur l'hôte → accès via localhost:5540
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genealogie-net

  # ── pgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: genealogie_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@genealogie.com
      PGADMIN_DEFAULT_PASSWORD: Admin123!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5380:80"   # 5200 dans plage exclue par Windows (5141-5240)
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - genealogie-net

  # ── Backend FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      target: runner
    container_name: genealogie_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env.dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=genealogie_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend:/app          # hot-reload en dev
      - /app/__pycache__        # exclut le cache du montage
    ports:
      - "8090:8000"   # 8000 bloqué, 8080 pris par un service système → accès via localhost:8090
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - genealogie-net

  # ── Frontend Angular ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: genealogie_frontend
    restart: unless-stopped
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules   # préserve les modules de l'image
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - genealogie-net
